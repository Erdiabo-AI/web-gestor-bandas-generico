{% extends "base.html" %}
{% block title %}Recuperar contraseña — {{ app_name }}{% endblock %}

{% block content %}
<div class="form-wrap">
  <h1>Recuperar contraseña</h1>
  <p class="hint">Introduce tu email. El administrador recibirá la solicitud y
    te hará llegar un enlace para restablecer la contraseña.</p>
  <form method="post" action="{{ url_for('auth.recuperar') }}" class="form">
    <label>Email
      <input type="email" name="email" required autofocus>
    </label>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Solicitar recuperación</button>
      <a class="btn btn-ghost" href="{{ url_for('auth.login') }}">Volver</a>
    </div>
  </form>
</div>
{% endblock %}
